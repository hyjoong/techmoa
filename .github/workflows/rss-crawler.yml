name: RSS Data Crawler

on:
  schedule:
    - cron: "0 22 * * *" # 한국 시간 오전 7시
    - cron: "0 10 * * *" # 한국 시간 오후 7시
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기 (DB 쓰기·AI 분류·알림 없음)"
        type: boolean
        default: true
      feed:
        description: "블로그 이름 (비우면 전체)"
        type: string
        default: ""
      since:
        description: "시작 날짜 (YYYY-MM-DD, 한국시간) 또는 시간대 포함 ISO 시각"
        type: string
        default: ""
      max_per_feed:
        description: "피드별 신규 분류 후보 상한"
        type: string
        default: "20"
      max_ai_articles:
        description: "실행 전체 AI 분류 대상 글 상한 (HTTP 재시도 제외)"
        type: string
        default: "120"
      send_notifications:
        description: "실제 저장 시 알림 발송"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "scripts/rss-crawler.js"
      - "lib/server/**"
      - "scripts/rss/**"
      - "scripts/ai-tags.js"
      - "scripts/discord-webhook.js"
      - "scripts/push-notification.js"
      - ".github/workflows/rss-crawler.yml"

# 권한 설정
permissions:
  contents: read

jobs:
  crawl-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run RSS crawler
        shell: bash
        run: |
          args=(--max-ai-articles 120)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args=()
            [[ "$INPUT_DRY_RUN" == "true" ]] && args+=(--dry-run)
            [[ "$INPUT_SEND_NOTIFICATIONS" != "true" ]] && args+=(--no-notifications)
            [[ -n "$INPUT_FEED" ]] && args+=(--feed "$INPUT_FEED")
            [[ -n "$INPUT_SINCE" ]] && args+=(--since "$INPUT_SINCE")
            args+=(--max-per-feed "$INPUT_MAX_PER_FEED")
            args+=(--max-ai-articles "$INPUT_MAX_AI_ARTICLES")
          fi
          pnpm run crawl-rss "${args[@]}"
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SEND_NOTIFICATIONS: ${{ inputs.send_notifications }}
          INPUT_FEED: ${{ inputs.feed }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_MAX_PER_FEED: ${{ inputs.max_per_feed }}
          INPUT_MAX_AI_ARTICLES: ${{ inputs.max_ai_articles }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload crawl results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rss-crawl-results
          path: rss-crawl-results.json
          retention-days: 30

      - name: Write crawl summary
        if: always()
        run: node scripts/rss/write-workflow-summary.js
